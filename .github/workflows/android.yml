name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Varmista Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tarkista versio ja muutoskuvaus
        run: python3 scripts/release_notes.py --check
      - name: Testit, lint ja koekäännös
        run: python3 scripts/ci_check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tarkistusraportit
          path: |
            app/build/reports/
      - uses: actions/upload-artifact@v5
        with:
          name: Uutishetki-debug-ei-julkaisu
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Varmista Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tarkista julkaisutagi ja kasvava versionCode
        run: python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --output release-notes.md
      - name: Pura pysyvä allekirjoitusavain
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo '::error::Allekirjoitussalaisuuksia puuttuu. Katso README:n käyttöönotto-ohje.'
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uutishetki.jks"
      - name: Rakenna allekirjoitettu APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/uutishetki.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Varmenna allekirjoitus ja julkaise
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apk="Uutishetki-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --verify-tag --title "Uutishetki $version" --notes-file release-notes.md
      - name: Poista allekirjoitusavain
        if: always()
        run: rm -f "$RUNNER_TEMP/uutishetki.jks"
