name: Android
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Varmista Android SDK 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo "::error::SDK 35 puuttuu polusta $ANDROID_HOME"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || { echo "::error::Build Tools 35.0.0 puuttuu polusta $ANDROID_HOME"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tarkista versio ja muutoskuvaus
        run: python3 scripts/release_notes.py --check
      - name: Julkaisusuojauksen kohdennetut testit
        run: python3 scripts/test_release_security.py
      - name: Testit, lint ja koekäännös
        run: python3 scripts/ci_check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tarkistusraportit
          path: |
            app/build/reports/
      - uses: actions/upload-artifact@v5
        with:
          name: Uutishetki-debug-ei-julkaisu
          path: app/build/outputs/apk/debug/app-debug.apk
